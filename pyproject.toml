[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgwrap-lokesh"
dynamic = ["version"]
description = "One command. Every package manager. Universal CLI wrapper for apt, pkg, pacman, dnf, yum, apk, brew, zypper, xbps, nix, eopkg, emerge, MacPorts, FreeBSD/OpenBSD pkg, winget and choco."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lokesh (trmxvibs)" }]
maintainers = [{ name = "Lokesh (trmxvibs)" }]
keywords = [
    "package-manager",
    "cli",
    "apt",
    "pacman",
    "dnf",
    "brew",
    "termux",
    "winget",
    "cross-platform",
    "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/trmxvibs/pkgwrap"
Repository = "https://github.com/trmxvibs/pkgwrap"
Issues = "https://github.com/trmxvibs/pkgwrap/issues"
Changelog = "https://github.com/trmxvibs/pkgwrap/blob/main/CHANGELOG.md"

[project.scripts]
pkgwrap = "pkgwrap.cli:run"
pkw = "pkgwrap.cli:run"

[tool.setuptools.dynamic]
version = { attr = "pkgwrap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pkgwrap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The codebase targets Python 3.9 and deliberately uses typing.List/Dict and
# str.format() so the source reads the same on every supported version.
ignore = ["UP006", "UP030", "UP032", "UP035"]

[tool.coverage.run]
source = ["pkgwrap"]
branch = true
